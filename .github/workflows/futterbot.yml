name: Shadow-Futterbot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: futterbot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Offset wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: offset.json
          key: telegram-offset-${{ github.run_id }}
          restore-keys: telegram-offset-

      - name: Telegram abholen & Futterliste pflegen
        run: python bot.py
        env:
          OFFSET_FILE: offset.json
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OBSIDIAN_COUCH_URL: ${{ secrets.OBSIDIAN_COUCH_URL }}
          OBSIDIAN_COUCH_USER: ${{ secrets.OBSIDIAN_COUCH_USER }}
          OBSIDIAN_COUCH_PASS: ${{ secrets.OBSIDIAN_COUCH_PASS }}
          OBSIDIAN_COUCH_DB: ${{ secrets.OBSIDIAN_COUCH_DB }}

      - name: Offset sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: offset.json
          key: telegram-offset-${{ github.run_id }}

      - name: Notiz-Backup aufbewahren
        if: hashFiles('backup-note.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: notiz-backup-${{ github.run_id }}
          path: backup-note.md
          retention-days: 90
