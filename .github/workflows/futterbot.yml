name: Shadow-Futterbot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: futterbot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Telegram abholen & Futterliste pflegen
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OBSIDIAN_COUCH_URL: ${{ secrets.OBSIDIAN_COUCH_URL }}
          OBSIDIAN_COUCH_USER: ${{ secrets.OBSIDIAN_COUCH_USER }}
          OBSIDIAN_COUCH_PASS: ${{ secrets.OBSIDIAN_COUCH_PASS }}
          OBSIDIAN_COUCH_DB: ${{ secrets.OBSIDIAN_COUCH_DB }}
